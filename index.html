<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Copilot 動画視聴</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: sans-serif; background:#f7f9fc; margin:0; padding:20px; }
  h1 { text-align:center; }
  .buttons { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:20px auto; max-width:800px; }
  .btn { padding:12px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; }
  .btn.active { border-color:#2367e8; box-shadow:0 0 0 3px rgba(35,103,232,.15); }
  video { width:100%; max-width:900px; display:block; margin:0 auto; background:#000; border-radius:8px; }
</style>
<script>document.addEventListener('contextmenu',e=>e.preventDefault());</script>
</head>
<body>
<h1>Copilot 動画視聴</h1>
<div class="buttons" id="buttons"></div>
<video id="video" controls controlsList="nodownload" disablePictureInPicture preload="none" playsinline></video>

<script>
const items = [
  { key:"chat", label:"Copilot Chat", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20Chat.mp4?sp=r&st=2025-10-17T06:20:24Z&se=2025-11-21T14:59:59Z&spr=https&sv=2024-11-04&sr=b&sig=Zlas4ARWVEcCpX%2F69I15fV6DDr1Nv56XGlMUYW29q44%3D" },
  { key:"excel", label:"Excel", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Excel.mp4?sp=r&st=2025-10-17T06:21:29Z&se=2025-11-21T14:59:59Z&spr=https&sv=2024-11-04&sr=b&sig=gWbgSTGRFAs1ERQArpMDwhmKvLi6%2BKw%2FGJZMihzBh7g%3D" },
  { key:"outlook", label:"Outlook", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Outlook.mp4?sp=r&st=2025-10-17T06:22:08Z&se=2025-11-21T14:59:59Z&spr=https&sv=2024-11-04&sr=b&sig=wrndMq92IeDrcPj6xfg%2F7OHiUvI6zuaq4m9i4n46lTw%3D" },
  { key:"powerpoint", label:"PowerPoint", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Power%20Point.mp4?sp=r&st=2025-10-17T06:22:43Z&se=2025-11-21T14:59:59Z&spr=https&sv=2024-11-04&sr=b&sig=1lIo3yUqD67uzhYaYHQXsaLxykjcIJ%2BdP2R4oywAIzA%3D" },
  { key:"teams", label:"Teams", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Teams.mp4?sp=r&st=2025-10-17T06:23:23Z&se=2025-11-21T14:59:59Z&spr=https&sv=2024-11-04&sr=b&sig=osWJC5h7asm7xIz%2B9PqBDasiv24Ls79eprLZxaOXesU%3D" },
  { key:"word", label:"Word", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Word.mp4?sp=r&st=2025-10-17T06:23:48Z&se=2025-11-21T14:59:59Z&spr=https&sv=2024-11-04&sr=b&sig=3bmc6heI%2BEqZO3lN9wtbOYSfqkB0kJrM8Cm3uGg8hME%3D" }
];

const buttonsEl = document.getElementById('buttons');
const videoEl = document.getElementById('video');

items.forEach((it,i)=>{
  const btn=document.createElement('button');
  btn.className='btn'+(i===0?' active':'');
  btn.textContent=it.label;
  btn.onclick=()=>{
    document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    videoEl.src=it.url;
    videoEl.load();
    videoEl.play().catch(()=>{});
  };
  buttonsEl.appendChild(btn);
});

videoEl.src = items[0].url;
</script>
</body>
</html>
