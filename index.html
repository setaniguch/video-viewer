<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Copilot 動画視聴</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: sans-serif; background:#f7f9fc; margin:0; padding:20px; }
  h1 { text-align:center; }
  .buttons { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:20px auto; max-width:800px; }
  .btn { padding:12px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; }
  .btn.active { border-color:#2367e8; box-shadow:0 0 0 3px rgba(35,103,232,.15); }
  video { width:100%; max-width:900px; display:block; margin:0 auto; background:#000; border-radius:8px; }
</style>
<script>document.addEventListener('contextmenu',e=>e.preventDefault());</script>
</head>
<body>
<h1>Copilot 動画視聴</h1>
<div class="buttons" id="buttons"></div>
<video id="video" controls controlsList="nodownload" disablePictureInPicture preload="none" playsinline></video>

<script>
const items = [
  { key:"chat", label:"Copilot Chat", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20Chat.mp4?sp=r&st=2025-12-09T02:42:52Z&se=2025-12-15T14:55:55Z&spr=https&sv=2024-11-04&sr=b&sig=JKVopykzzDar89L%2BgNImqS%2FPz1fXunCPycO7%2BLC02QI%3D" },
  { key:"excel", label:"Excel", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Excel.mp4?sp=r&st=2025-12-09T02:44:54Z&se=2025-12-14T14:55:55Z&spr=https&sv=2024-11-04&sr=b&sig=uw%2Bgi93V8L5SyDCiW%2BQ8K0tmwyINfXIWzfuhpf4v5S8%3D" },
  { key:"outlook", label:"Outlook", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Outlook.mp4?sp=r&st=2025-12-09T02:46:15Z&se=2025-12-14T14:55:55Z&spr=https&sv=2024-11-04&sr=b&sig=hx%2Byrv62EY90rI24p2zJvecTEjljf5lEnkZvd1gHNfU%3D" },
  { key:"powerpoint", label:"PowerPoint", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Power%20Point.mp4?sp=r&st=2025-12-09T02:46:47Z&se=2025-12-14T14:55:55Z&spr=https&sv=2024-11-04&sr=b&sig=y5GKAabE20TxJDyMfjQmufpm0dPFxc9U6hFTJws6nx0%3D" },
  { key:"teams", label:"Teams", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Teams.mp4?sp=r&st=2025-12-09T02:47:13Z&se=2025-12-14T14:55:55Z&spr=https&sv=2024-11-04&sr=b&sig=rQFJHcs1AHW9UMFbzfl3Ec3vwqbJjdToDIVHn%2FxVgBA%3D" },
  { key:"word", label:"Word", url:"https://stacssa.blob.core.windows.net/videos/Copilot%20in%20Word.mp4?sp=r&st=2025-12-09T02:47:35Z&se=2025-12-14T14:55:55Z&spr=https&sv=2024-11-04&sr=b&sig=14TXhoLA%2BcG0%2BgtOE8NPaXgr98kkFhOosZ1M2pBOtNQ%3D" }
];

const buttonsEl = document.getElementById('buttons');
const videoEl = document.getElementById('video');

items.forEach((it,i)=>{
  const btn=document.createElement('button');
  btn.className='btn'+(i===0?' active':'');
  btn.textContent=it.label;
  btn.onclick=()=>{
    document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    videoEl.src=it.url;
    videoEl.load();
    videoEl.play().catch(()=>{});
  };
  buttonsEl.appendChild(btn);
});

videoEl.src = items[0].url;
</script>
</body>
</html>
